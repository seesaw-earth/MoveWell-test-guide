<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MoveWell 测试动作指导</title>
<style>
  /* VOICE: calm, clinical, warm — a physiotherapist showing you, not a manual shouting at you.
     IDEA: the printed exercise card a physio hands out, come alive: one figure doing the test in a real room.
     PICTURE: a 3D stage with the person, the chair, the floor tape and the phone with what it can see.
     COLOUR and TYPE: MoveWell's own paper, sage and gold; serif titles, system sans for the steps.
     LAYOUT: a phone: header, test picker, stage, the card for the tab, three tabs at the bottom.
     IN THE APP (MoveWell/Features/Checks/TestGuideView.swift): no frame, header or picker; the app's own title bar
     names the test; text follows the app's text size (--ts), language and appearance. */
  :root {
    color-scheme: light dark;
    --paper: #FBF8F4; --card: #F3ECE2; --ink: #3B332D; --ink-2: #6F655B;
    --sage: #4F6B4C; --sage-soft: #DCE6D3; --gold: #95722F; --gold-soft: #F4E7CB;
    --line: rgba(59, 51, 45, .13); --stage: #F4EFE7; --floor: #ECE4D7; --grid: rgba(59, 51, 45, .07);
    --wall: #EFE7DA; --wall-line: rgba(59, 51, 45, .12); --frame: #E9E1D5; --shadow: rgba(70, 50, 35, .18);
    --serif: ui-serif, "New York", "Iowan Old Style", "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", Georgia, serif;
    --ts: 1;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) {
      --paper: #161513; --card: #24221F; --ink: #F3EDE6; --ink-2: #ABA196; --sage: #8FAE88; --sage-soft: #2F3B2C;
      --gold: #D4B26A; --gold-soft: #3A3121; --line: rgba(243, 237, 230, .15); --stage: #1B1A17; --floor: #24221E;
      --grid: rgba(243, 237, 230, .06); --wall: #2A2723; --wall-line: rgba(243, 237, 230, .1); --frame: #0D0C0B; --shadow: rgba(0, 0, 0, .45);
    }
  }
  :root[data-theme=dark] {
    color-scheme: dark;
    --paper: #161513; --card: #24221F; --ink: #F3EDE6; --ink-2: #ABA196; --sage: #8FAE88; --sage-soft: #2F3B2C;
    --gold: #D4B26A; --gold-soft: #3A3121; --line: rgba(243, 237, 230, .15); --stage: #1B1A17; --floor: #24221E;
    --grid: rgba(243, 237, 230, .06); --wall: #2A2723; --wall-line: rgba(243, 237, 230, .1); --frame: #0D0C0B; --shadow: rgba(0, 0, 0, .45);
  }
  :root[data-theme=light] { color-scheme: light; }
  * { box-sizing: border-box; min-width: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--frame); color: var(--ink); font: calc(15px * var(--ts))/1.5 var(--sans); display: grid; place-items: center; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; border-radius: 8px; }

  .device { width: min(100vw, 412px); height: 100vh; height: min(100dvh, 880px); background: var(--paper); display: flex; flex-direction: column; overflow: hidden; position: relative; }
  @media (min-width: 480px) and (min-height: 640px) { .device { border-radius: 38px; border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(40, 30, 20, .2); } }
  .embed body { background: var(--paper); }
  .embed .device { width: 100vw; height: 100vh; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
  .embed .top, .embed .picker { display: none; }
  .embed .stage { min-height: 200px; }

  .top { flex: 0 0 auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 16px 20px 8px; }
  .brand { font: 600 calc(21px * var(--ts))/1.1 var(--serif); }
  .sub { font-size: calc(13px * var(--ts)); color: var(--ink-2); margin-top: 3px; }
  .lang { display: flex; background: var(--card); border-radius: 999px; padding: 3px; flex: none; }
  .lang button { border: 0; background: none; padding: 4px 11px; border-radius: 999px; font-size: calc(12px * var(--ts)); font-weight: 600; color: var(--ink-2); cursor: pointer; min-height: 30px; }
  .lang button[aria-pressed="true"] { background: var(--paper); color: var(--ink); }

  .picker { flex: 0 0 auto; display: flex; gap: 6px; overflow-x: auto; padding: 2px 20px 10px; scroll-snap-type: x proximity; scrollbar-width: none; }
  .picker::-webkit-scrollbar { display: none; }
  .picker button { flex: none; scroll-snap-align: start; border: 0; background: var(--card); color: var(--ink-2); padding: 7px 13px; border-radius: 999px; font-size: calc(13px * var(--ts)); font-weight: 600; cursor: pointer; min-height: 36px; white-space: nowrap; }
  .picker button[aria-pressed="true"] { background: var(--sage); color: var(--paper); }
  .picker button .new { display: inline-block; margin-left: 5px; font-size: calc(10px * var(--ts)); padding: 0 5px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); vertical-align: 1px; }
  .picker button[aria-pressed="true"] .new { background: rgba(255,255,255,.22); color: var(--paper); }

  .stage { flex: 1 1 0; min-height: 230px; position: relative; background: var(--stage); }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  .stage canvas:active { cursor: grabbing; }
  .chips { position: absolute; left: 14px; right: 14px; top: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
  .chip { font-size: calc(13px * min(var(--ts), 1.25)); font-weight: 600; font-variant-numeric: tabular-nums; padding: 5px 11px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); white-space: nowrap; }
  .chip.main { color: var(--sage); }
  .chip.note { color: var(--ink-2); font-weight: 500; font-size: calc(12px * min(var(--ts), 1.25)); margin-left: auto; }
  .chip.bad { color: var(--gold); }
  .cue { position: absolute; left: 0; right: 0; top: 38%; text-align: center; font: 600 calc(34px * min(var(--ts), 1.25))/1 var(--serif); color: var(--sage); opacity: 0; transition: opacity .25s, transform .25s; transform: scale(.92); pointer-events: none; text-shadow: 0 1px 0 var(--paper); }
  .cue.on { opacity: 1; transform: none; }
  .frame-check { position: absolute; left: 14px; right: 14px; bottom: 12px; text-align: center; pointer-events: none; }
  .frame-check span { display: inline-block; font-size: calc(12.5px * min(var(--ts), 1.25)); font-weight: 600; padding: 5px 11px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); }
  .frame-check .ok { color: var(--sage); } .frame-check .warn { color: var(--gold); }
  .hint { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: calc(12px * min(var(--ts), 1.25)); color: var(--ink-2); pointer-events: none; transition: opacity .5s; }
  .hint.gone { opacity: 0; }

  .panel { flex: 0 1 auto; max-height: 50%; overflow: auto; padding: 14px 20px 12px; }
  .panel h2 { font: 600 calc(20px * min(var(--ts), 1.3))/1.28 var(--serif); margin: 0 0 4px; }
  .panel p { margin: 0 0 12px; color: var(--ink-2); font-size: calc(14px * var(--ts)); }
  .panel h3 { font: 600 calc(13px * var(--ts))/1.3 var(--sans); color: var(--ink-2); margin: 14px 0 6px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 4px 0 10px; }
  .btn { border: 0; background: var(--card); padding: 8px 14px; border-radius: 999px; font-size: calc(14px * var(--ts)); font-weight: 600; cursor: pointer; min-height: 38px; }
  .btn[aria-pressed="true"] { background: var(--sage-soft); color: var(--sage); }
  .btn.primary { background: var(--sage); color: var(--paper); }
  .btn.wide { width: 100%; min-height: 46px; font-size: calc(15px * var(--ts)); }
  .seg { display: inline-flex; background: var(--card); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-size: calc(13px * var(--ts)); font-weight: 600; color: var(--ink-2); cursor: pointer; min-height: 32px; }
  .seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px var(--shadow); }

  ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
  ol.steps li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; padding: 8px 10px; margin: 0 -10px; border-radius: 14px; cursor: pointer; font-size: calc(14.5px * var(--ts)); line-height: 1.45; }
  ol.steps li::before { content: counter(s); display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--card); color: var(--ink-2); font-size: calc(12px * var(--ts)); font-weight: 700; }
  ol.steps li[aria-current="step"] { background: var(--sage-soft); }
  ol.steps li[aria-current="step"]::before { background: var(--sage); color: var(--paper); }
  ol.steps li small { display: block; color: var(--ink-2); font-size: calc(12.5px * var(--ts)); }

  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { position: relative; padding: 3px 0 3px 22px; font-size: calc(14px * var(--ts)); }
  ul.list li::before { content: ""; position: absolute; left: 4px; top: .72em; width: 7px; height: 7px; border-radius: 50%; background: var(--sage); }
  ul.list.bad li::before { background: var(--gold); border-radius: 1px; transform: rotate(45deg); }
  ul.list.safe li::before { background: var(--ink-2); }
  .tag { display: inline-block; font-size: calc(12px * var(--ts)); font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--sage-soft); color: var(--sage); margin-right: 6px; }
  .tag.gold { background: var(--gold-soft); color: var(--gold); }
  .src { font-size: calc(12px * var(--ts)); color: var(--ink-2); margin-top: 12px; }

  .fade { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin: 2px 0 8px; font-size: calc(13px * var(--ts)); font-weight: 600; }
  .key { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .key i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .key.bad { color: var(--gold); } .key.bad i { background: #D2B26B; }
  .key.ok { color: var(--sage); } .key.ok i { background: #7E9B78; }
  .key.bad.ref { color: var(--ink-2); } .key.bad.ref i { background: #B7B0A7; }
  #moveTags { margin: -6px 0 10px; } #moveTags:empty { display: none; }
  input[type=range] { width: 100%; accent-color: var(--sage); margin: 0; height: 28px; }
  .caption.ref { background: var(--card); }
  .caption { font-size: calc(13.5px * var(--ts)); color: var(--ink); background: var(--gold-soft); border-radius: 12px; padding: 8px 11px; margin: 4px 0 4px; }

  .tabs { flex: 0 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
  .tabs button { border: 0; background: none; padding: 15px 4px 14px; line-height: 1.2; font-size: calc(14px * min(var(--ts), 1.2)); font-weight: 600; color: var(--ink-2); cursor: pointer; position: relative; }
  .tabs button[aria-selected="true"] { color: var(--sage); }
  .tabs button[aria-selected="true"]::before { content: ""; position: absolute; left: 30%; right: 30%; top: -1px; height: 2px; background: var(--sage); border-radius: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-height: 720px) {
    .top { padding: 10px 20px 6px; } .stage { min-height: 200px; } .panel { padding: 10px 20px 8px; }
    .panel h2 { font-size: calc(18px * var(--ts)); } ol.steps li { padding: 6px 10px; } .tabs button { padding: 12px 6px 11px; }
  }
  @media (prefers-reduced-motion: reduce) { .cue, .hint { transition: none; } }
</style>
</head>
<body>
<div class="device" id="app">
  <header class="top">
    <div>
      <div class="brand">MoveWell</div>
      <div class="sub" data-i18n="sub"></div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="es">ES</button>
    </div>
  </header>

  <nav class="picker" id="picker" aria-label="Tests"></nav>

  <section class="stage" id="stage">
    <h2 class="sr-only" id="stageTitle"></h2>
    <canvas id="view" tabindex="0" role="img"></canvas>
    <div class="chips"><span class="chip main" id="chipMain"></span><span class="chip note" id="chipNote" hidden></span></div>
    <div class="cue" id="cue" aria-hidden="true"></div>
    <div class="frame-check" id="frameCheck" hidden><span id="frameText"></span></div>
    <div class="hint" id="hint" data-i18n="hint"></div>
  </section>

  <section class="panel" id="panel-move">
    <h2 id="moveTitle"></h2>
    <p id="moveShows"></p>
    <div id="moveTags"></div>
    <ol class="steps" id="steps"></ol>
    <div class="row">
      <button class="btn" type="button" id="play"></button>
      <button class="btn" type="button" id="slow" aria-pressed="false" data-i18n="slow"></button>
      <div class="seg" role="group" id="views">
        <button type="button" data-view="front" data-i18n="v_front"></button>
        <button type="button" data-view="side" data-i18n="v_side"></button>
        <button type="button" data-view="above" data-i18n="v_above"></button>
      </div>
    </div>
  </section>

  <section class="panel" id="panel-setup" hidden>
    <h2 data-i18n="setup_title"></h2>
    <button class="btn primary wide" type="button" id="phoneBtn" aria-pressed="false"></button>
    <h3 data-i18n="h_need"></h3>
    <ul class="list" id="need"></ul>
    <h3 data-i18n="h_gate" id="gateTitle"></h3>
    <ul class="list safe" id="gate"></ul>
    <h3 data-i18n="h_phone"></h3>
    <p id="phoneText" style="margin-bottom:4px"></p>
    <div id="phoneTags"></div>
    <h3 data-i18n="h_helper"></h3>
    <p id="helperText"></p>
  </section>

  <section class="panel" id="panel-points" hidden>
    <h2 data-i18n="points_title"></h2>
    <div id="fadeBox">
      <div class="fade">
        <span class="key bad"><i></i><span data-i18n="k_bad"></span></span>
        <input type="range" id="mix" min="0" max="100" value="50">
        <span class="key ok"><i></i><span data-i18n="k_ok"></span></span>
      </div>
      <div class="row" style="margin:2px 0 6px">
        <div class="seg" role="group" id="cmp">
          <button type="button" data-cmp="side" data-i18n="m_side"></button>
          <button type="button" data-cmp="overlay" data-i18n="m_overlay"></button>
        </div>
      </div>
      <div class="caption" id="badCaption"></div>
    </div>
    <h3 data-i18n="h_counts"></h3>
    <ul class="list" id="counts"></ul>
    <h3 data-i18n="h_bad"></h3>
    <ul class="list bad" id="bads"></ul>
    <h3 data-i18n="h_safe"></h3>
    <ul class="list safe" id="safe"></ul>
    <div class="src" id="src"></div>
  </section>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="move" aria-selected="true" data-i18n="tab_move"></button>
    <button type="button" role="tab" data-tab="setup" aria-selected="false" data-i18n="tab_setup"></button>
    <button type="button" role="tab" data-tab="points" aria-selected="false" data-i18n="tab_points"></button>
  </nav>
</div>

<script>
{
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ============================================================ the app */
// In MoveWell this page is shown by the app (Features/Checks/TestGuideView.swift), which sets window.__MW_CONFIG__
// before the page runs: { test: the CheckKind's raw value, tab: move | setup | points, lang: zh | en | es,
// theme: light | dark, ts: text scale }. The same can go in the address to try it in a browser:
// index.html?embed=1&test=turn180&lang=es&tab=setup
const CFG = Object.assign(Object.fromEntries(new URLSearchParams(location.search)), window.__MW_CONFIG__ || {});
const EMBED = !!window.__MW_CONFIG__ || CFG.embed === '1';
if (EMBED) {
  document.documentElement.classList.add('embed');
  // the page fills the app's screen; pinching zooms the figure, not the page
  document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no');
}
const LANGS = ['zh', 'en', 'es'];

/* ================================================================ words */
const UI = {
  zh: {
    sub: '测试动作指导 · 演示（示范动作）', hint: '拖动可以绕着看，双指或滚轮缩放', hint_touch: '拖动可以绕着看，双指缩放',
    tab_move: '动作', tab_setup: '摆放', tab_points: '要点',
    play: '播放', pause: '暂停', slow: '慢动作', v_front: '正面', v_side: '侧面', v_above: '俯视',
    setup_title: '东西怎么摆，手机放哪', phone_on: '回到全景', phone_off: '看看手机拍到什么',
    h_need: '需要准备', h_phone: '手机', h_helper: '帮手', h_gate: '先确认：有一条不符合，今天就不做这项',
    points_title: '做对的样子', k_bad: '常见错误', k_ok: '正确', m_overlay: '叠加', m_side: '并排', h_counts: '怎样才算', h_bad: '常见错误', h_safe: '注意安全',
    portrait: '竖放', landscape: '横放', height: '离地约 {h}', dist: '距离 {d}',
    timer: '⏱ {s} 秒', count: '第 {n} 次', done: '已做 {n} 次', left: '还剩 {s} 秒', go: '开始！', stop: '停！',
    fast: '演示已加速', short: '演示：{real} 缩短成 {demo} 秒',
    frame_ok: '✓ 整个测试过程中，全身都在画面里', frame_bad: '有时出了画面：{parts}', frame_scene_ok: '✓ {what}也都在画面里', frame_scene_bad: '看不全{what}',
    part_head: '头', part_feet: '脚', part_hands: '手', sep: '、',
    view_label: '{name}的示范动画。拖动或用方向键旋转。', new: '新',
    src: '依据：{s}',
  },
  en: {
    sub: 'How to do each test · demo (sample movements)', hint: 'Drag to look around; pinch or scroll to zoom', hint_touch: 'Drag to look around; pinch to zoom',
    tab_move: 'Movement', tab_setup: 'Setup', tab_points: 'Key points',
    play: 'Play', pause: 'Pause', slow: 'Slow motion', v_front: 'Front', v_side: 'Side', v_above: 'Above',
    setup_title: 'What goes where, and the phone', phone_on: 'Back to the room', phone_off: 'See what the phone sees',
    h_need: 'You need', h_phone: 'The phone', h_helper: 'The helper', h_gate: 'First check: if any of these isn’t true, skip this test today',
    points_title: 'Doing it right', k_bad: 'Common mistake', k_ok: 'Right', m_overlay: 'Overlay', m_side: 'Side by side', h_counts: 'What counts', h_bad: 'Common mistakes', h_safe: 'Safety',
    portrait: 'Portrait', landscape: 'Landscape', height: 'about {h} off the floor', dist: '{d} away',
    timer: '⏱ {s} s', count: 'Rep {n}', done: '{n} done', left: '{s} s left', go: 'Go!', stop: 'Stop!',
    fast: 'Sped up for the demo', short: 'Demo: {real} shortened to {demo} s',
    frame_ok: '✓ The whole body stays in view for the whole test', frame_bad: 'Out of view at times: {parts}', frame_scene_ok: '✓ {what} in view too', frame_scene_bad: 'Cannot see all of {what}',
    part_head: 'head', part_feet: 'feet', part_hands: 'hands', sep: ', ',
    view_label: 'Animated demonstration of the {name}. Drag or use the arrow keys to rotate.', new: 'new',
    src: 'Based on: {s}',
  },
  es: {
    sub: 'Cómo hacer cada prueba · demostración (movimientos de ejemplo)', hint: 'Arrastre para mirar alrededor; pellizque o use la rueda para acercar', hint_touch: 'Arrastre para mirar alrededor; pellizque para acercar',
    tab_move: 'Movimiento', tab_setup: 'Preparación', tab_points: 'Claves',
    play: 'Reproducir', pause: 'Pausa', slow: 'Cámara lenta', v_front: 'Frente', v_side: 'Lado', v_above: 'Arriba',
    setup_title: 'Qué va dónde, y el teléfono', phone_on: 'Volver a la sala', phone_off: 'Ver lo que ve el teléfono',
    h_need: 'Necesita', h_phone: 'El teléfono', h_helper: 'Quien ayuda', h_gate: 'Antes, compruebe: si algo de esto no se cumple, hoy no haga esta prueba',
    points_title: 'Cómo hacerlo bien', k_bad: 'Error frecuente', k_ok: 'Correcto', m_overlay: 'Superpuesto', m_side: 'Lado a lado', h_counts: 'Qué cuenta', h_bad: 'Errores frecuentes', h_safe: 'Seguridad',
    portrait: 'Vertical', landscape: 'Horizontal', height: 'a unos {h} del suelo', dist: 'a {d}',
    timer: '⏱ {s} s', count: 'Repetición {n}', done: '{n} hechas', left: 'Quedan {s} s', go: '¡Ya!', stop: '¡Pare!',
    fast: 'Acelerado para la demostración', short: 'Demostración: {real} acortados a {demo} s',
    frame_ok: '✓ Todo el cuerpo se ve durante toda la prueba', frame_bad: 'A veces fuera de la imagen: {parts}', frame_scene_ok: '✓ También a la vista: {what}', frame_scene_bad: 'No se ve todo: {what}',
    part_head: 'la cabeza', part_feet: 'los pies', part_hands: 'las manos', sep: ', ',
    view_label: 'Demostración animada: {name}. Arrastre o use las flechas para girar.', new: 'nuevo',
    src: 'Fuente: {s}',

const navLang = (navigator.language || '').toLowerCase();
let lang = LANGS.includes(CFG.lang) ? CFG.lang : navLang.startsWith('zh') ? 'zh' : navLang.startsWith('es') ? 'es' : 'en';
const t = (k, vars) => { let s = UI[lang][k] ?? k; if (vars) for (const [a, b] of Object.entries(vars)) s = s.split('{' + a + '}').join(b); return s; };
const keepUnits = x => typeof x === 'string' ? x.replace(/(\d) (?=(?:m|s|cm|kg|lb|°|%)(?![\p{L}]))/gu, '$1\u00a0') : x;
const L = o => keepUnits((o && typeof o === 'object' && !Array.isArray(o) && ('zh' in o)) ? (o[lang] ?? o.en) : o);
/** The text in the page's language, from its three wordings. */
const P = (zh, en, es) => lang === 'zh' ? zh : lang === 'es' ? es : en;
/** A number in a given language's way (a decimal comma in Spanish); `num` uses the page's language. */
const fmt = (x, d, l) => l === 'es' ? x.toFixed(d).replace('.', ',') : x.toFixed(d);
const num = (x, d = 1) => fmt(x, d, lang);

/* ================================================================= math */
const TAU = Math.PI * 2, UP = [0, 1, 0];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const sc = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len = a => Math.hypot(a[0], a[1], a[2]);
const unit = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const mix = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const facing = y => [Math.sin(y), 0, Math.cos(y)];
const rightOf = f => unit(cross(f, UP));             // the person's right when facing f
const rot = (v, k, a) => { const c = Math.cos(a), s = Math.sin(a); return add(add(sc(v, c), sc(cross(k, v), s)), sc(k, dot(k, v) * (1 - c))); };
const V = (x, y, z) => [x, y, z];
/** A smooth, repeatable wobble (sum of sines), for sway and tremor. */
const wob = (tt, seed) => Math.sin(tt * 1.31 + seed) * .6 + Math.sin(tt * 2.73 + seed * 2.1) * .3 + Math.sin(tt * 4.9 + seed * .7) * .1;

/* ============================================================= the body */
// An older adult of 1.65 m (segment lengths from Winter's anthropometric table), metres. Faceless, like MoveGrow.
const B = { thigh: .41, shin: .41, ankleH: .08, toe: .17, heel: .06, hipHalf: .09, torso: .48, shHalf: .17, shDrop: .035,
            neck: .07, headR: .105, upper: .29, fore: .25 };
const STAND_Y = B.ankleH + (B.thigh + B.shin) * .985;
const SEAT_H = .45, HIP_SEAT = .09;

/** Two-link IK: the middle joint for ends a and c, bending towards `pole`. */
function ik2(a, c, l1, l2, pole) {
  const d = sub(c, a), dir = unit(d);
  const L0 = clamp(len(d), Math.abs(l1 - l2) + 1e-4, l1 + l2 - 1e-4);
  const x = (l1 * l1 - l2 * l2 + L0 * L0) / (2 * L0), h = Math.sqrt(Math.max(0, l1 * l1 - x * x));
  let p = sub(pole, sc(dir, dot(pole, dir)));
  if (len(p) < 1e-6) p = Math.abs(dir[1]) < .9 ? cross(dir, UP) : [1, 0, 0];
  return add(add(a, sc(dir, x)), sc(unit(p), h));
}

const ARM_HANG = { flex: .05, abd: .1, elbow: .18 };

/** The joints of a body from a pose: pelvis position, facing (yaw), trunk lean and roll, world ankle positions
    (legs solved by IK, knees forward), foot yaw and pitch, arms by angles, hand target, crossed or on the thighs. */
function makeBody(s) {
  const f = facing(s.yaw), r = rightOf(f);
  let up = add(sc(UP, Math.cos(s.lean || 0)), sc(f, Math.sin(s.lean || 0)));
  if (s.roll) up = rot(up, f, s.roll);
  up = unit(up);
  const tf = unit(sub(f, sc(up, dot(f, up)))), tr = unit(cross(tf, up));
  const J = { up, tf, tr, f, pelvis: s.p };
  J.neck = add(s.p, sc(up, B.torso));
  for (const [S, sg] of [['L', -1], ['R', 1]]) {
    J['hip' + S] = add(s.p, sc(r, sg * B.hipHalf));
    const ft = (s.feet && s.feet[S]) || {};
    const fd = facing(ft.yaw ?? s.yaw), fr = rightOf(fd), pitch = ft.pitch || 0;
    const ank = s.ankles[S];
    J['ankle' + S] = ank;
    J['knee' + S] = ik2(J['hip' + S], ank, B.thigh, B.shin, add(fd, sc(UP, .1)));
    J['toe' + S] = add(ank, rot(add(sc(fd, B.toe), sc(UP, -B.ankleH * .5)), fr, pitch));
    J['heel' + S] = add(ank, rot(add(sc(fd, -B.heel), sc(UP, -B.ankleH * .5)), fr, pitch));
    J['sh' + S] = add(add(J.neck, sc(up, -B.shDrop)), sc(tr, sg * B.shHalf));
  }
  for (const [S, sg] of [['L', -1], ['R', 1]]) {
    const a = (s.arms && s.arms[S]) || ARM_HANG;
    const [el, wr, fdir] = armJoints(J, S, sg, a);
    J['el' + S] = el; J['wr' + S] = wr; J['hand' + S] = add(wr, sc(fdir, .055)); J['fdir' + S] = fdir;
  }
  const hp = (s.head && s.head.pitch) || 0, hy = (s.head && s.head.yaw) || 0;
  const hu = unit(add(sc(up, Math.cos(hp)), sc(tf, Math.sin(hp))));
  let hf = unit(add(sc(tf, Math.cos(hp)), sc(up, -Math.sin(hp))));
  if (hy) hf = rot(hf, hu, hy);
  J.hu = hu; J.hf = hf;
  J.head = add(J.neck, sc(hu, B.neck + B.headR * .92));
  return J;
}

function armTarget(J, S, sg, a) {
  const up = J.up, tf = J.tf, out = sc(J.tr, sg);
  if (a.cross) {                       // arms crossed on the chest: the hand rests below the other shoulder
    const other = J[(S === 'L' ? 'shR' : 'shL')];
    return { hand: add(add(other, sc(tf, .11)), sc(up, -.1)), pole: add(add(sc(up, -1), sc(out, .5)), sc(tf, .35)) };
  }
  if (a.thigh) {                       // the hand lies on the thigh, near the knee
    const hip = J['hip' + S], knee = J['knee' + S];
    return { hand: add(mix(hip, knee, .62), add(sc(UP, .085), sc(out, .01))), pole: add(add(sc(up, -.4), sc(out, .8)), sc(tf, -.4)) };
  }
  if (a.hand) return { hand: a.hand, pole: a.pole || add(sc(up, -1), sc(out, .6)) };
  return null;
}

function armJoints(J, S, sg, a) {
  const sh = J['sh' + S];
  if (a.blend) {                       // between two arm poses (positions blended, then lengths restored by IK)
    const [p, q] = a.blend.map(b => armJoints(J, S, sg, b));
    const w = a.k, wr = mix(p[1], q[1], w), el0 = mix(p[0], q[0], w);
    const el = ik2(sh, wr, B.upper, B.fore, sub(el0, mix(sh, wr, .5)));
    return [el, wr, unit(sub(wr, el))];
  }
  const tg = armTarget(J, S, sg, a);
  if (tg) {
    const hand = a.jitter ? add(tg.hand, a.jitter) : tg.hand;
    const el = ik2(sh, hand, B.upper, B.fore, tg.pole);
    return [el, hand, unit(sub(hand, el))];
  }
  const up = J.up, tf = J.tf, out = sc(J.tr, sg);
  let d = add(sc(up, -Math.cos(a.flex || 0)), sc(tf, Math.sin(a.flex || 0)));
  d = unit(add(sc(d, Math.cos(a.abd || 0)), sc(out, Math.sin(a.abd || 0))));
  const el = add(sh, sc(d, B.upper));
  let n = sub(tf, sc(d, dot(tf, d)));
  n = len(n) < 1e-3 ? up : unit(n);
  const fdir = unit(add(sc(d, Math.cos(a.elbow || 0)), sc(n, Math.sin(a.elbow || 0))));
  let wr = add(el, sc(fdir, B.fore));
  if (a.jitter) wr = add(wr, a.jitter);
  return [el, wr, fdir];
}

/* --------------------------------------------------------- materials */
const MAT = {
  shirt: ['#7E9B78', '#A9C2A3', '#5C7857'], pants: ['#8E9FB0', '#B9C6D2', '#6F8193'], skin: ['#F0C3A6', '#FBE2D2', '#C79074'],
  hair: ['#D6D1CA', '#EEEBE6', '#A49D94'], shoe: ['#5A524C', '#7A716A', '#3B3530'], wood: ['#B58B5E', '#D2AE83', '#7D5A38'],
  seat: ['#C9A57A', '#E1C59E', '#8F6B45'], metal: ['#6C7278', '#9AA1A8', '#4A4F54'], phone: ['#2F2C2A', '#57524E', '#1C1A19'],
  cone: ['#E08A3C', '#F2B27A', '#A85F22'], tape: ['#5B8DD6', '#8FB2E6', '#3E6DB3'], ruler: ['#E5C15A', '#F3DC94', '#B08F2C'],
  counter: ['#D9D1C4', '#ECE6DC', '#A69C8D'],
};
const GOLD = { all: ['#D2B26B', '#E8D29C', '#AC8C45'] };
const GHOST = { all: ['#B7B0A7', '#D7D1CA', '#8D867D'] };

/** Drawing primitives of a body. `pal`: null for its own colours, or a one-colour palette for a ghost. */
function bodyPrims(J, extra) {
  const P = [];
  const cap = (a, b, ra, rb, c) => P.push({ k: 'cap', a, b, ra, rb, c });
  const ball = (a, r, c, tag) => P.push({ k: 'ball', a, r, c, tag });
  for (const S of ['L', 'R']) {
    cap(J['hip' + S], J['knee' + S], .07, .057, 'pants');
    cap(J['knee' + S], J['ankle' + S], .055, .043, 'pants');
    cap(J['heel' + S], J['toe' + S], .043, .037, 'shoe');
  }
  cap(J.hipL, J.hipR, .105, .105, 'pants');
  cap(add(J.pelvis, sc(J.up, .05)), add(J.neck, sc(J.up, -.1)), .135, .15, 'shirt');
  for (const S of ['L', 'R']) {
    ball(J['sh' + S], .07, 'shirt');
    cap(J['sh' + S], J['el' + S], .056, .046, 'shirt');
    cap(J['el' + S], J['wr' + S], .044, .034, 'skin');
    ball(J['hand' + S], .046, 'skin');
  }
  cap(add(J.neck, sc(J.up, -.03)), add(J.head, sc(J.hu, -.07)), .05, .046, 'skin');
  ball(J.head, B.headR, 'skin', 'head');
  ball(add(add(J.head, sc(J.hu, .02)), sc(J.hf, -.022)), B.headR * .985, 'hair', 'hair');
  if (extra) extra(J, P, cap, ball);
  return P;
}

/* ============================================================ the room */
/** A box (centre, size [width along the right, height, depth along the front], facing yaw) as six faces. */
function box(P, c, size, yaw, m, z = 0) {
  const f = facing(yaw), r = rightOf(f);
  const hx = sc(r, size[0] / 2), hy = sc(UP, size[1] / 2), hz = sc(f, size[2] / 2);
  const faces = [[hy, hx, hz, 1.08], [sc(hy, -1), hx, hz, .82], [hx, hy, hz, .9], [sc(hx, -1), hy, hz, .9], [hz, hx, hy, .96], [sc(hz, -1), hx, hy, .86]];
  for (const [n, a, b, light] of faces) {
    const cc = add(c, n);
    P.push({ k: 'poly', pts: [add(add(cc, a), b), add(sub(cc, a), b), sub(sub(cc, a), b), sub(add(cc, a), b)], n: unit(n), at: cc, m, light, z });
  }
}

function chairPrims(P, ch) {
  const f = facing(ch.yaw), r = rightOf(f), o = ch.pos;
  const at = (x, y, zf) => add(add(add(o, sc(r, x)), sc(UP, y)), sc(f, zf));
  box(P, at(0, SEAT_H - .025, -.22), [.46, .05, .44], ch.yaw, 'seat', .06);
  box(P, at(0, SEAT_H + .26, -.45), [.44, .44, .04], ch.yaw, 'wood', .04);
  for (const x of [-.2, .2]) for (const zf of [-.04, -.42]) P.push({ k: 'cap', a: at(x, 0, zf), b: at(x, SEAT_H - .05, zf), ra: .018, rb: .018, c: 'wood', z: .05 });
  for (const x of [-.2, .2]) P.push({ k: 'cap', a: at(x, SEAT_H, -.45), b: at(x, SEAT_H + .48, -.45), ra: .018, rb: .018, c: 'wood', z: .05 });
  if (ch.arms) for (const x of [-.265, .265]) {
    P.push({ k: 'cap', a: at(x, SEAT_H + .22, -.42), b: at(x, SEAT_H + .22, -.05), ra: .026, rb: .026, c: 'wood', z: .03 });
    P.push({ k: 'cap', a: at(x, SEAT_H - .02, -.07), b: at(x, SEAT_H + .22, -.07), ra: .016, rb: .016, c: 'wood', z: .03 });
  }
}

function phonePrims(P, ph) {
  const d = unit(sub(ph.aim, ph.pos)), yaw = Math.atan2(d[0], d[2]);
  const hub = sub(ph.pos, [0, ph.land ? .06 : .1, 0]);
  const fd = facing(yaw), r = rightOf(fd);
  for (let i = 0; i < 3; i++) {
    const a = i * TAU / 3 + .5, foot = add(add([hub[0], 0, hub[2]], sc(r, .22 * Math.cos(a))), sc(fd, .22 * Math.sin(a)));
    P.push({ k: 'cap', a: foot, b: hub, ra: .011, rb: .011, c: 'metal' });
  }
  P.push({ k: 'cap', a: hub, b: sub(ph.pos, [0, .03, 0]), ra: .012, rb: .012, c: 'metal' });
  box(P, ph.pos, ph.land ? [.27, .135, .02] : [.135, .27, .02], yaw + Math.PI, 'phone');   // drawn 1.8× life size, to be seen
}

/** The test's room: chair, floor tape, cone, wall, counter, wall tape, ruler, phone. Each task lists what it needs. */
function roomPrims(task, opts) {
  const P = [], R = task.room;
  if (R.chair) chairPrims(P, R.chair);
  if (R.counter) box(P, R.counter.c, R.counter.size, R.counter.yaw || 0, 'counter', .02);
  if (R.cone) P.push({ k: 'cap', a: R.cone, b: add(R.cone, [0, .32, 0]), ra: .1, rb: .015, c: 'cone' });
  if (R.ruler) box(P, R.ruler.c, [.035, .008, .32], R.ruler.yaw || 0, 'ruler', -.02);
  if (opts.phone) phonePrims(P, task.phone);
  return P;
}

/* ============================================================== render */
let colors = {};
function readColors() {
  const css = getComputedStyle(document.documentElement), g = k => css.getPropertyValue(k).trim();
  colors = { floor: g('--floor'), grid: g('--grid'), wall: g('--wall'), wallLine: g('--wall-line'), shadow: g('--shadow'),
             sage: g('--sage'), gold: g('--gold'), ink: g('--ink'), ink2: g('--ink-2'), paper: g('--paper'), line: g('--line'), stage: g('--stage') };
}

function orbitCam(c, W, H) {
  const ce = Math.cos(c.el), se = Math.sin(c.el);
  const pos = [c.target[0] + c.dist * ce * Math.sin(c.az), c.target[1] + c.dist * se, c.target[2] + c.dist * ce * Math.cos(c.az)];
  const f = unit(sub(c.target, pos)), r = unit(cross(f, UP)), u = cross(r, f);
  return { pos, f, r, u, focal: (H / 2) / Math.tan(c.fov / 2), cx: W / 2, cy: H * .5 };
}

/** The phone's own view: portrait 9:16 (about 69° high, 42° wide, iPhone main camera filming video) or landscape. */
function phoneCam(ph, W, H) {
  const f = unit(sub(ph.aim, ph.pos)), r = unit(cross(f, UP)), u = cross(r, f);
  const vf = (ph.land ? 42.3 : 69) * Math.PI / 180;
  let rh = H * .86, rw = ph.land ? rh * 16 / 9 : rh * 9 / 16;
  if (rw > W * .92) { rw = W * .92; rh = ph.land ? rw * 9 / 16 : rw * 16 / 9; }
  const rect = { x: (W - rw) / 2, y: (H - rh) / 2, w: rw, h: rh };
  return { pos: ph.pos, f, r, u, focal: (rh / 2) / Math.tan(vf / 2), cx: W / 2, cy: H / 2, rect };
}

function projector(cam) {
  return p => { const d = sub(p, cam.pos), z = dot(d, cam.f); return { x: cam.cx + cam.focal * dot(d, cam.r) / z, y: cam.cy - cam.focal * dot(d, cam.u) / z, z, s: cam.focal / z }; };
}

function capPath(ctx, A, B2, ra, rb) {
  const ang = Math.atan2(B2.y - A.y, B2.x - A.x);
  ctx.beginPath();
  if (Math.hypot(B2.x - A.x, B2.y - A.y) < .5) ctx.arc(A.x, A.y, Math.max(ra, rb), 0, TAU);
  else { ctx.arc(A.x, A.y, ra, ang + Math.PI / 2, ang - Math.PI / 2); ctx.arc(B2.x, B2.y, rb, ang - Math.PI / 2, ang + Math.PI / 2); }
  ctx.closePath();
}

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => clamp(Math.round(v * k), 0, 255));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}

function drawItems(ctx, items, proj, cam, lw, pal) {
  const near = .08;
  const list = [];
  for (const p of items) {
    if (p.k === 'poly') {
      if (p.n && dot(p.n, sub(cam.pos, p.at)) <= 0) continue;
      const Q = p.pts.map(proj);
      if (Q.some(q => q.z < near)) continue;
      list.push({ p, Q, z: Q.reduce((s, q) => s + q.z, 0) / Q.length + (p.z || 0) });
    } else {
      const A = proj(p.a), B2 = p.b ? proj(p.b) : null;
      if (A.z < near || (B2 && B2.z < near)) continue;
      list.push({ p, A, B: B2, z: (B2 ? (A.z + B2.z) / 2 : A.z) + (p.z || 0) });
    }
  }
  // Hair sits behind the head seen from the front and over it seen from behind.
  const head = list.find(i => i.p.tag === 'head');
  for (const it of list) if (it.p.tag === 'hair' && head) {
    const away = dot(sub(it.p.a, head.p.a), cam.f) < 0;
    it.z = head.z + (away ? -1e-4 : 1e-4);
  }
  list.sort((a, b) => b.z - a.z);
  for (const it of list) {
    const p = it.p, m = pal ? pal.all : MAT[p.c || p.m];
    const [base, hi, line] = m;
    if (p.k === 'poly') {
      ctx.beginPath(); it.Q.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)); ctx.closePath();
      ctx.fillStyle = shade(base, p.light || 1); ctx.fill();
      ctx.strokeStyle = line; ctx.lineWidth = lw * .8; ctx.lineJoin = 'round'; ctx.stroke();
    } else if (p.k === 'ball') {
      const r = p.r * it.A.s;
      ctx.fillStyle = line; ctx.beginPath(); ctx.arc(it.A.x, it.A.y, r + lw, 0, TAU); ctx.fill();
      ctx.fillStyle = base; ctx.beginPath(); ctx.arc(it.A.x, it.A.y, r, 0, TAU); ctx.fill();
      ctx.globalAlpha *= .55; ctx.fillStyle = hi; ctx.beginPath(); ctx.arc(it.A.x - r * .25, it.A.y - r * .28, r * .55, 0, TAU); ctx.fill(); ctx.globalAlpha /= .55;
    } else {
      const ra = p.ra * it.A.s, rb = p.rb * it.B.s;
      ctx.fillStyle = line; capPath(ctx, it.A, it.B, ra + lw, rb + lw); ctx.fill();
      ctx.fillStyle = base; capPath(ctx, it.A, it.B, ra, rb); ctx.fill();
      ctx.globalAlpha *= .5; ctx.fillStyle = hi;
      capPath(ctx, { x: it.A.x - ra * .2, y: it.A.y - ra * .24 }, { x: it.B.x - rb * .2, y: it.B.y - rb * .24 }, ra * .5, rb * .5);
      ctx.fill(); ctx.globalAlpha /= .5;
    }
  }
}

function floorPoly(ctx, proj, pts) {
  const Q = pts.map(proj);
  if (Q.some(q => q.z < .05)) return false;
  ctx.beginPath(); Q.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)); ctx.closePath();
  return true;
}
function floorDisc(ctx, proj, c, rx, rz) {
  const pts = [];
  for (let i = 0; i < 32; i++) { const a = i / 32 * TAU; pts.push([c[0] + rx * Math.cos(a), .002, c[2] + rz * Math.sin(a)]); }
  return floorPoly(ctx, proj, pts);
}
/** A segment on the floor, clipped to the part in front of the camera. */
function segment(ctx, proj, a, b) {
  const A = proj(a), B2 = proj(b);
  if (A.z < .05 && B2.z < .05) return false;
  let pa = A, pb = B2;
  if (A.z < .05 || B2.z < .05) {
    const k = (.05 - A.z) / (B2.z - A.z), c = proj(mix(a, b, A.z < .05 ? k + .01 : k - .01));
    if (A.z < .05) pa = c; else pb = c;
  }
  ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y);
  return true;
}

const layers = [];
function layer(i, W, H) {
  const c = layers[i] || (layers[i] = document.createElement('canvas'));
  if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
  const x = c.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, W, H);
  return [c, x];
}

/** The whole scene: walls, floor (area, metre grid, tape, footprint of the phone's view, measured distances,
    shadows), then the room's things and the main body sorted by depth, the ghosts as see-through layers, and the
    labels on top. */
function render(ctx, W, H, cam, scene) {
  const proj = projector(cam), lw = Math.max(1, W / 460);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = colors.stage; ctx.fillRect(0, 0, W, H);
  const R = scene.task.room, labels = [];
  // walls (only seen from the room side)
  for (const w of R.walls || []) {
    if (dot(w.n, sub(cam.pos, w.pts[0])) <= 0) continue;
    if (floorPoly(ctx, proj, w.pts)) { ctx.fillStyle = colors.wall; ctx.fill(); ctx.strokeStyle = colors.wallLine; ctx.lineWidth = lw; ctx.stroke(); }
    for (const d of w.decals || []) if (floorPoly(ctx, proj, d.pts)) { ctx.fillStyle = MAT[d.m][0]; ctx.fill(); if (d.label && !scene.phoneView) labels.push({ p: d.at, text: L(d.label), tone: 'sage' }); }
  }
  // floor
  const F = R.floor;
  if (floorPoly(ctx, proj, [[F[0], 0, F[2]], [F[1], 0, F[2]], [F[1], 0, F[3]], [F[0], 0, F[3]]])) { ctx.fillStyle = colors.floor; ctx.fill(); }
  ctx.strokeStyle = colors.grid; ctx.lineWidth = lw;
  for (let x = Math.ceil(F[0]); x <= F[1]; x++) if (segment(ctx, proj, [x, .001, F[2]], [x, .001, F[3]])) ctx.stroke();
  for (let z = Math.ceil(F[2]); z <= F[3]; z++) if (segment(ctx, proj, [F[0], .001, z], [F[1], .001, z])) ctx.stroke();
  if (scene.phone && !scene.phoneView) {
    ctx.fillStyle = colors.sage; ctx.globalAlpha = .13;
    if (floorPoly(ctx, proj, footprint(scene.task.phone))) ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (const tp of R.tape || []) {
    const f = facing(tp.yaw || 0), r = rightOf(f), c = tp.c, hw = (tp.w || .6) / 2;
    const pts = [add(add(c, sc(r, hw)), sc(f, .025)), add(sub(c, sc(r, hw)), sc(f, .025)), sub(sub(c, sc(r, hw)), sc(f, .025)), sub(add(c, sc(r, hw)), sc(f, .025))].map(p => [p[0], .003, p[2]]);
    if (floorPoly(ctx, proj, pts)) { ctx.fillStyle = MAT.tape[0]; ctx.fill(); }
    if (tp.label && !scene.phoneView) labels.push({ p: add(c, sc(r, -hw - .25)), text: L(tp.label), tone: 'ink' });
  }
  if (scene.dims) for (const d of scene.dims) {
    const a = [d.a[0], .004, d.a[2]], b = [d.b[0], .004, d.b[2]], n = sc(unit(cross(sub(b, a), UP)), .09);
    ctx.strokeStyle = colors.sage; ctx.lineWidth = lw * 1.8; ctx.lineCap = 'round';
    if (segment(ctx, proj, a, b)) ctx.stroke();
    for (const e of [a, b]) if (segment(ctx, proj, add(e, n), sub(e, n))) ctx.stroke();
    labels.push({ p: d.at || mix(a, b, .5), text: L(d.text), tone: 'sage' });
  }
  // the phone's view: where its picture's frame meets the test (lightly filled) and four thin rays
  if (scene.phone && !scene.phoneView) {
    const ph = scene.task.phone, cs = frustumCorners(ph);
    ctx.fillStyle = colors.sage; ctx.globalAlpha = .07;
    if (floorPoly(ctx, proj, cs)) ctx.fill();
    ctx.globalAlpha = .5; ctx.strokeStyle = colors.sage; ctx.lineWidth = lw * 1.3;
    if (floorPoly(ctx, proj, cs)) ctx.stroke();
    ctx.globalAlpha = .35; ctx.lineWidth = lw; ctx.setLineDash([lw * 3, lw * 4]);
    for (const c of cs) if (segment(ctx, proj, ph.pos, c)) ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    labels.push({ p: add(ph.pos, [0, .32, 0]), text: P('手机 · ', 'Phone · ', 'Teléfono · ') + t(ph.land ? 'landscape' : 'portrait'), tone: 'ink' });
  }
  // soft shadows
  ctx.save();
  if ('filter' in ctx) ctx.filter = `blur(${Math.round(lw * 4)}px)`;
  for (const b of scene.bodies) {
    if (b.alpha < .03) continue;
    ctx.globalAlpha = b.alpha * (b.ghost ? .5 : 1); ctx.fillStyle = colors.shadow;
    if (floorDisc(ctx, proj, b.J.pelvis, .2, .2)) ctx.fill();
    for (const S of ['L', 'R']) if (b.J['ankle' + S][1] < .2 && floorDisc(ctx, proj, mix(b.J['heel' + S], b.J['toe' + S], .5), .1, .1)) ctx.fill();
  }
  ctx.restore();
  // things and bodies
  const main = scene.bodies.find(b => b.main && b.alpha >= .995) || null;
  const items = roomPrims(scene.task, { phone: scene.phone && !scene.phoneView });
  if (scene.roomOffset) items.push(...movedPrims(roomPrims(scene.task, {}), scene.roomOffset));
  for (const b of scene.bodies) if (b.label && b.alpha > .05) labels.push({ p: [b.J.pelvis[0], 0, b.J.pelvis[2]], text: t(b.label), tone: b.pal === GOLD ? 'gold' : b.pal === GHOST ? 'ink' : 'sage' });
  if (main) items.push(...bodyPrims(main.J, main.extra));
  const others = scene.bodies.filter(b => b !== main && b.alpha >= .03);
  const depth = b => dot(sub(b.J.pelvis, cam.pos), cam.f);
  const behind = others.filter(b => !main || b.behind || depth(b) > depth(main)).sort((a, b) => depth(b) - depth(a));
  const front = others.filter(b => main && !b.behind && depth(b) <= depth(main)).sort((a, b) => depth(b) - depth(a));
  let li = 0;
  const ghost = b => {
    const [c, x] = layer(li++, W, H);
    drawItems(x, bodyPrims(b.J, b.extra), proj, cam, lw, b.pal);
    ctx.globalAlpha = b.alpha * (b.ghost ? .55 : 1); ctx.drawImage(c, 0, 0); ctx.globalAlpha = 1;
  };
  if (!main) { drawItems(ctx, items, proj, cam, lw, null); }
  behind.forEach(ghost);
  if (main) drawItems(ctx, items, proj, cam, lw, null);
  front.forEach(ghost);
  for (const l of scene.labels || []) labels.push(l);
  drawLabels(ctx, proj, labels, lw);
}

function drawLabels(ctx, proj, labels, lw) {
  ctx.font = `600 ${Math.round(12 * lw * Math.min(TS, 1.25))}px ${getComputedStyle(document.body).fontFamily}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const l of labels) {
    const q = proj(l.p);
    if (q.z < .1) continue;
    const w = ctx.measureText(l.text).width + 16 * lw, h = 22 * lw;
    q.x = clamp(q.x, Math.min(w / 2 + 4 * lw, ctx.canvas.width / 2), Math.max(ctx.canvas.width - w / 2 - 4 * lw, ctx.canvas.width / 2));
    ctx.fillStyle = colors.paper; ctx.strokeStyle = colors.line; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(q.x - w / 2, q.y - h / 2, w, h, h / 2) : ctx.rect(q.x - w / 2, q.y - h / 2, w, h);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = l.tone === 'gold' ? colors.gold : l.tone === 'ink' ? colors.ink : colors.sage;
    ctx.fillText(l.text, q.x, q.y + lw);
  }
}

function frustumCorners(ph) {
  const f = unit(sub(ph.aim, ph.pos)), r = unit(cross(f, UP)), u = cross(r, f);
  const hv = (ph.land ? 42.3 : 69) * Math.PI / 360, hh = (ph.land ? 69 : 42.3) * Math.PI / 360, D = len(sub(ph.aim, ph.pos));
  return [[1, 1], [-1, 1], [-1, -1], [1, -1]].map(([a, b]) => add(ph.pos, sc(add(add(f, sc(r, a * Math.tan(hh))), sc(u, b * Math.tan(hv))), D)));
}
/** Where the phone's view meets the floor, up to just past the test. */
function footprint(ph) {
  const f = unit(sub(ph.aim, ph.pos)), r = unit(cross(f, UP)), u = cross(r, f);
  const hv = Math.tan((ph.land ? 42.3 : 69) * Math.PI / 360), hh = Math.tan((ph.land ? 69 : 42.3) * Math.PI / 360);
  const edge = [];
  const N = 12;
  for (let i = 0; i <= N; i++) edge.push([lerp(-1, 1, i / N), -1]);
  for (let i = 0; i <= N; i++) edge.push([1, lerp(-1, 1, i / N)]);
  for (let i = 0; i <= N; i++) edge.push([lerp(1, -1, i / N), 1]);
  for (let i = 0; i <= N; i++) edge.push([-1, lerp(1, -1, i / N)]);
  return edge.map(([a, b]) => {
    const d = unit(add(add(f, sc(r, a * hh)), sc(u, b * hv)));
    const far = len(sub(ph.aim, ph.pos)) * 1.08 / dot(d, f);
    let k = d[1] < -1e-3 ? -ph.pos[1] / d[1] : far;
    k = Math.min(k, far);
    const p = add(ph.pos, sc(d, k));
    return [p[0], .002, p[2]];
  });
}

/* ============================================================= motion */
/** Seated and standing positions for a chair. */
function seatGeom(ch) {
  const f = facing(ch.yaw), r = rightOf(f);
  const hip = add(add(ch.pos, sc(f, -.2)), [0, SEAT_H + HIP_SEAT, 0]);
  const g = add(ch.pos, sc(f, .2));
  return { f, r, yaw: ch.yaw, hip, ground: g, ankL: add(add(g, sc(r, -.11)), [0, B.ankleH, 0]), ankR: add(add(g, sc(r, .11)), [0, B.ankleH, 0]),
           stand: add([g[0], STAND_Y, g[2]], sc(f, -.03)) };
}
/** Along the sit-to-stand path: k = 0 seated, 1 standing. Forward first (over the feet), then up. */
function stsAt(g, k) {
  const zf = smooth(Math.min(1, k * 1.6)), yk = smooth(k);
  return [lerp(g.hip[0], g.stand[0], zf), lerp(g.hip[1], g.stand[1], yk), lerp(g.hip[2], g.stand[2], zf)];
}
/** Rising (u 0→1 over the rise): lean forward first, then up; returns the standing-ness and the trunk lean. */
function rising(u) {
  const bump = u < .32 ? smooth(u / .32) : 1 - smooth((u - .32) / .68);
  return { k: smooth((u - .22) / .78), lean: lerp(.1, .05, smooth(u)) + .5 * bump };
}
/** Sitting down (u 0→1): lean forward while lowering, back upright on the seat. */
function sitting(u) {
  const bump = u < .55 ? smooth(u / .55) : 1 - smooth((u - .55) / .45);
  return { k: 1 - smooth(u / .88), lean: lerp(.05, .1, smooth(u)) + .42 * bump };
}

/** Feet planted except while they swing to their next placement (a smoothstep along the ground, a sine lift). */
class Footsteps {
  constructor(l, r, yaw) { this.start = { L: { p: l, yaw }, R: { p: r, yaw } }; this.at = { L: this.start.L, R: this.start.R }; this.steps = []; }
  add(side, tl, td, p, yaw) { this.steps.push({ side, tl, td, from: this.at[side], to: { p, yaw } }); this.at[side] = { p, yaw }; }
  foot(side, tt, lift = .06) {
    let cur = this.start[side];
    for (const s of this.steps) {
      if (s.side !== side) continue;
      if (tt < s.tl) return { p: cur.p, yaw: cur.yaw, pitch: 0 };
      if (tt < s.td) {
        const u = (tt - s.tl) / (s.td - s.tl), k = smooth(u);
        const p = mix(s.from.p, s.to.p, k);
        return { p: add(p, [0, lift * Math.sin(Math.PI * u), 0]), yaw: lerp(s.from.yaw, s.to.yaw, k), pitch: .25 * Math.sin(TAU * u) };
      }
      cur = s.to;
    }
    return { p: cur.p, yaw: cur.yaw, pitch: 0 };
  }
}
const place = (g, yaw, side) => add(add(g, sc(rightOf(facing(yaw)), side === 'R' ? .1 : -.1)), [0, B.ankleH, 0]);
/** Arms swing against the legs: an arm goes forward when the other leg's foot is ahead of the pelvis. */
function swingArms(p, f, aL, aR, k = 1) {
  const fw = a => clamp(dot(sub(a, p), f) / .32, -1, 1);
  return { L: { flex: .32 * fw(aR) * k, abd: .07, elbow: .22 + .1 * Math.max(0, fw(aR)) * k }, R: { flex: .32 * fw(aL) * k, abd: .07, elbow: .22 + .1 * Math.max(0, fw(aL)) * k } };
}

/* ------------------------------------------------------- Timed Up and Go */
function tugPlan(turnZ, o = {}) {
  const ch = { pos: [0, 0, 0], yaw: 0, arms: true }, g = seatGeom(ch);
  const go = 1, riseS = 1.3, speed = o.speed || .8, T = o.stepT || .6;
  const tUp = go + riseS, z0 = g.ground[2];
  const tTurn0 = tUp + (turnZ - z0) / speed, turnS = o.turnS || 1.8, tTurn1 = tTurn0 + turnS;
  const tBack1 = tTurn1 + (turnZ - z0) / speed, tSit0 = tBack1 + 1.5, sitS = 1.4, tSeated = tSit0 + sitS;
  const feet = new Footsteps(g.ankL, g.ankR, 0), turning = [];
  let side = 'R';
  const walk = (t0, t1, gz0, dir, yaw) => {
    const dist = turnZ - z0, n = Math.max(2, Math.round(dist / (speed * T))), dt = (t1 - t0) / n, sl = dist / n;
    for (let k = 1; k <= n; k++) {
      const land = t0 + k * dt, gz = gz0 + dir * (sl * k + (k < n ? .5 * sl : 0));
      feet.add(side, land - .78 * dt, land, place([0, 0, gz], yaw, side), yaw); side = side === 'R' ? 'L' : 'R';
    }
  };
  const turn = (t0, t1, gz, h0, h1, n) => {
    const d = (t1 - t0) / n, sw = Math.min(.8 * d, .5);
    for (let k = 1; k <= n; k++) {
      const land = t0 + k * d, ha = lerp(h0, h1, (k - 1) / n), hb = lerp(h0, h1, k / n);
      feet.add(side, land - sw, land, place([0, 0, gz], hb, side), hb); turning.push([land - sw, land, ha, hb]); side = side === 'R' ? 'L' : 'R';
    }
  };
  walk(tUp, tTurn0, z0, 1, 0);
  turn(tTurn0, tTurn1, turnZ, 0, Math.PI, o.turnSteps || 4);
  walk(tTurn1, tBack1, turnZ, -1, Math.PI);
  turn(tBack1, tSit0 - .35, z0, Math.PI, TAU, 3);
  feet.add(side, tSit0 - .35, tSit0, side === 'R' ? g.ankR : g.ankL, TAU);
  const heading = tt => { let h = 0; for (const [a, c, h0, h1] of turning) { if (tt < a) break; if (tt < c) return lerp(h0, h1, smooth((tt - a) / (c - a))); h = h1; } return h; };
  const seatedArms = J0 => ({ L: { hand: add(add(g.hip, sc(g.r, -.26)), [0, .19, .2]) }, R: { hand: add(add(g.hip, sc(g.r, .26)), [0, .19, .2]) } });
  return {
    go, end: tSeated, chair: ch, tUp, tTurn0, tTurn1, tBack1, tSit0,
    pose(tt) {
      const fl = feet.foot('L', tt), fr = feet.foot('R', tt);
      const ankles = { L: fl.p, R: fr.p }, fts = { L: { yaw: fl.yaw, pitch: fl.pitch }, R: { yaw: fr.yaw, pitch: fr.pitch } };
      if (tt < tUp) {
        const u = clamp((tt - go) / riseS, 0, 1), st = rising(u);
        const arms = seatedArms();
        const k = smooth((u - .45) / .4);
        const a = k > 0 ? { L: { blend: [arms.L, ARM_HANG], k }, R: { blend: [arms.R, ARM_HANG], k } } : arms;
        return { p: stsAt(g, st.k), yaw: 0, lean: st.lean, ankles, feet: fts, arms: a };
      }
      if (tt >= tSit0) {
        const u = clamp((tt - tSit0) / sitS, 0, 1), st = sitting(u), arms = seatedArms();
        const k = 1 - smooth((u - .35) / .5);
        return { p: stsAt(g, st.k), yaw: 0, lean: st.lean, ankles, feet: fts, arms: { L: { blend: [arms.L, ARM_HANG], k }, R: { blend: [arms.R, ARM_HANG], k } } };
      }
      let gz;
      if (tt < tTurn0) gz = z0 + speed * (tt - tUp);
      else if (tt < tTurn1) gz = turnZ;
      else if (tt < tBack1) gz = turnZ - speed * (tt - tTurn1);
      else gz = z0;
      const h = heading(tt), f = facing(h), ph = (tt - tUp) / T * Math.PI;
      const p = [.012 * Math.sin(ph), STAND_Y - .012 + .01 * Math.cos(2 * ph), gz - .03 * Math.cos(h)];
      return { p, yaw: h, lean: .07, ankles, feet: fts, arms: swingArms(p, f, ankles.L, ankles.R), head: { pitch: .08 } };
    },
  };
}

/* ------------------------------------------------------ chair stands */
function chairStandPlan(o) {
  const ch = { pos: [0, 0, 0], yaw: 0, arms: false }, g = seatGeom(ch), go = 1;
  const { reps, upS, downS, hold, stopAt, half, pushing, shallow, hover } = o;
  const cyc = upS + downS + 2 * hold;
  return {
    go, chair: ch,
    phase(tt) {
      // 0 seated … 1 standing, with the count of full stands so far
      const s = tt - go;
      if (s < 0) return { k: 0, lean: .1, n: 0, up: false };
      let i = Math.floor(s / cyc), u = s - i * cyc;
      if (stopAt !== undefined && s >= stopAt) {        // after Stop: finish standing, then sit and rest
        i = Math.floor(stopAt / cyc); u = stopAt - i * cyc;
        const after = s - stopAt, rest = stopAt - i * cyc;
        let k, lean;
        if (rest < upS + hold) {                       // was rising at Stop: completes the stand
          const ru = clamp(rest / upS + after / upS, 0, 1);
          if (ru < 1) { const st = rising(ru); k = st.k; lean = st.lean; }
          else { const su = clamp((after - (upS - rest)) / downS, 0, 1), st = sitting(su); k = st.k; lean = st.lean; }
        } else { const su = clamp((rest - upS - hold) / downS + after / downS, 0, 1), st = sitting(su); k = st.k; lean = st.lean; }
        return { k, lean, n: Math.min(reps, i) + (half && rest < upS && rising(rest / upS).k > .5 ? 1 : 0), up: false, stopped: true };
      }
      if (i >= reps) { const st = sitting(clamp((s - reps * cyc + downS + hold) / downS, 1, 1)); return { k: 0, lean: .1, n: reps, up: false }; }
      if (u < upS) { const st = rising(u / upS); return { k: st.k, lean: st.lean, n: i, up: true }; }
      if (u < upS + hold) return { k: 1, lean: .05, n: i + 1, up: true };
      if (u < upS + hold + downS) { const st = sitting((u - upS - hold) / downS); return { k: st.k, lean: st.lean, n: i + 1, up: false }; }
      return { k: 0, lean: .1, n: i + 1, up: false };
    },
    pose(tt) {
      const ph = this.phase(tt);
      let k = ph.k;
      if (shallow) k = Math.min(k, .8) * (1 / .8) * .8;         // never quite straight
      if (hover) k = .1 + k * .9;                              // never quite back on the seat
      const p = stsAt(g, k);
      const arms = pushing ? { L: { thigh: true }, R: { thigh: true } } : { L: { cross: true }, R: { cross: true } };
      return { p, yaw: 0, lean: ph.lean + (pushing ? .12 * Math.sin(Math.PI * k) : 0), ankles: { L: g.ankL, R: g.ankR }, arms, head: { pitch: .05 } };
    },
  };
}

/* ------------------------------------------------------------ 4 m walk */
function walkPlan(o) {
  const go = 1, vmax = .95, T = .6, startZ = -.17, acc = .7, dec = 1.1;
  // pelvis z(t): accelerate, cruise, decelerate to a stop at stopZ (numerically integrated)
  const stopZ = o.stopZ, slowFrom = o.slowFrom;
  const dt = .01, Z = [], Vv = [];
  let z = startZ, v = 0;
  for (let i = 0; i < 1400; i++) {
    const tt = i * dt;
    let target = tt < go ? 0 : vmax * smooth((tt - go) / acc);
    const remain = stopZ - z;
    const brake = slowFrom !== undefined ? Math.max(0, (z - slowFrom) / (stopZ - slowFrom)) : (remain < .8 ? 1 - remain / .8 : 0);
    target *= 1 - smooth(brake);
    if (remain < .02) target = 0;
    v += (target - v) * Math.min(1, dt / .18);
    z += v * dt; Z.push(z); Vv.push(v);
  }
  const zAt = tt => { const i = clamp(Math.floor(tt / dt), 0, Z.length - 2), k = tt / dt - i; return lerp(Z[i], Z[i + 1], clamp(k, 0, 1)); };
  const vAt = tt => Vv[clamp(Math.round(tt / dt), 0, Vv.length - 1)];
  const feet = new Footsteps(place([0, 0, startZ], 0, 'L'), place([0, 0, startZ], 0, 'R'), 0);
  let side = 'R', tl = go + .15;
  while (tl < 12) {
    const land = tl + .78 * T, v = vAt(land);
    if (v < .06) { // a last, closing step beside the other foot
      feet.add(side, tl, tl + .5, place([0, 0, zAt(land)], 0, side), 0); break;
    }
    feet.add(side, tl, land, place([0, 0, zAt(land) + .5 * v * T], 0, side), 0);
    side = side === 'R' ? 'L' : 'R'; tl += T;
  }
  // the timer stops when the first toe passes the 4 m line
  let cross = null;
  for (let tt = go; tt < 12 && cross === null; tt += .01) for (const S of ['L', 'R']) if (feet.foot(S, tt).p[2] + B.toe > 4) { cross = tt; break; }
  return {
    go, cross,
    pose(tt) {
      const fl = feet.foot('L', tt), fr = feet.foot('R', tt), ankles = { L: fl.p, R: fr.p };
      const ph = (tt - go) / T * Math.PI, v = vAt(tt), k = clamp(v / .4, 0, 1);
      const p = [.012 * Math.sin(ph) * k, STAND_Y - .012 * k + .01 * Math.cos(2 * ph) * k, zAt(tt) - .02];
      return { p, yaw: 0, lean: .04 + .04 * k, ankles, feet: { L: { pitch: fl.pitch }, R: { pitch: fr.pitch } }, arms: swingArms(p, [0, 0, 1], ankles.L, ankles.R, k), head: { pitch: .06 } };
    },
  };
}

/* ------------------------------------------------------ standing balance */
// Feet in metres: [to the person's left, forward]. One-foot stances name the foot that is lifted.
const STANCES = [
  { id: 'sbs', L: [.055, 0], R: [-.055, 0], sway: .004, arms: 0 },
  { id: 'semi', L: [.045, -.06], R: [-.045, .06], sway: .007, arms: .1 },
  { id: 'tandem', L: [.006, -.115], R: [-.006, .115], sway: .014, arms: .32 },
  { id: 'onR', L: [.06, -.1], R: [-.05, 0], lift: 'L', sway: .02, arms: .45 },     // standing on the right foot (first, as in the app)
  { id: 'onL', L: [.05, 0], R: [-.06, -.1], lift: 'R', sway: .02, arms: .45 },     // standing on the left foot
];

/* ------------------------------------------------------------- seated */
function seated(g, extra) {
  return Object.assign({ p: g.hip, yaw: g.yaw, lean: .08, ankles: { L: g.ankL, R: g.ankR }, arms: { L: { thigh: true }, R: { thigh: true } }, head: { pitch: .02 } }, extra || {});
}

/** Arm curl: the right arm curls the weight; the forearm turns palm-up on the way (the weight's bar turns with it). */
function curlPlan(o) {
  const ch = { pos: [0, 0, 0], yaw: 0, arms: false }, g = seatGeom(ch), go = 1;
  const upS = .8, top = .08, downS = .8, cyc = 1.963, reps = 16;
  const curl = tt => {
    const s = tt - go;
    if (s < 0 || s > 30 + .9) return s > 30 && s < 30 + .9 ? null : 0;
    const u = s % cyc;
    if (Math.floor(s / cyc) >= reps) return 0;
    if (u < upS) return smooth(u / upS);
    if (u < upS + top) return 1;
    if (u < upS + top + downS) return 1 - smooth((u - upS - top) / downS);
    return 0;
  };
  const amount = tt => {
    const s = tt - go;
    if (s > 30 && s < 30 + 2.2) {                      // after the 30 s: the 16th curl goes up and comes down
      const u = s - 15 * cyc;
      if (u < upS) return smooth(u / upS);
      if (u < upS + top) return 1;
      return 1 - smooth(clamp((u - upS - top) / downS, 0, 1));
    }
    const c = curl(tt); return c === null ? 0 : c;
  };
  const count = tt => {
    const s = tt - go;
    if (s < 0) return 0;
    const full = Math.min(15, Math.floor((Math.min(s, 30) + cyc - upS) / cyc));
    return s >= 30 ? 16 : full;
  };
  return {
    go, count, amount,
    pose(tt) {
      const w = amount(tt);
      const elbow = o.partial ? lerp(.55, 1.95, w) : lerp(.05, 2.45, w);
      const flex = o.swing ? lerp(.05, .7, w) : .04;
      const sup = w;
      return seated(g, {
        lean: .04,
        arms: { L: { thigh: true }, R: { flex, abd: .06, elbow } },

}
function dumbbell(J, P, cap, ball, supination) {
  const hand = J.handR, axis = unit(mix(J.tf, J.tr, supination));
  const a = add(hand, sc(axis, -.075)), b = add(hand, sc(axis, .075));
  P.push({ k: 'cap', a, b, ra: .014, rb: .014, c: 'metal' });
  P.push({ k: 'ball', a, r: .042, c: 'metal' });
  P.push({ k: 'ball', a: b, r: .042, c: 'metal' });
}

/** 2-minute step: marching in place, right knee first; a lift counts when the knee reaches the wall tape. */
function stepPlan(o) {
  const go = 1, P = .62, n = 18, low = o.allLow ? null : 4;   // the 5th right lift stays low
  const lift = tt => {
    const s = tt - go;
    if (s < 0 || s >= n * P) return { R: 0, L: 0, i: -1 };
    const i = Math.floor(s / P), u = (s - i * P) / P, w = u < .45 ? smooth(u / .45) : u < .9 ? 1 - smooth((u - .45) / .45) : 0;
    const side = i % 2 === 0 ? 'R' : 'L', ri = Math.floor(i / 2);
    const target = o.allLow || (side === 'R' && ri === low) ? .7 : 1.17;
    return { R: side === 'R' ? w * target : 0, L: side === 'L' ? w * target : 0, i, side, ri, w, low: target < 1 };
  };
  const counted = tt => {
    const s = tt - go; if (s < 0) return 0;
    let c = 0;
    for (let i = 0; i < n; i += 2) { if (s >= i * P + .45 * P && !(o.allLow || i / 2 === low)) c++; }
    return c;
  };
  return {
    go, P, n, lift, counted, low,
    pose(tt) {
      const l = lift(tt), p = [0, STAND_Y, 0], ankles = {}, feet = {};
      for (const S of ['L', 'R']) {
        const th = l[S], hipp = add(p, [S === 'R' ? -B.hipHalf : B.hipHalf, 0, 0]);
        const knee = add(hipp, [0, -B.thigh * Math.cos(th), B.thigh * Math.sin(th)]);
        let a = add(knee, [0, -B.shin, .02 * th]);
        a[1] = Math.max(B.ankleH, a[1]);
        ankles[S] = a; feet[S] = { pitch: -.35 * th };
      }
      const swing = (l.R - l.L) * .35;
      return { p, yaw: 0, lean: .03, ankles, feet, arms: { L: { flex: swing, abd: .08, elbow: .5 }, R: { flex: -swing, abd: .08, elbow: .5 } }, head: { pitch: .03 } };
    },
  };
}

/** Chair sit-and-reach: on the front edge, the right leg straight (heel down, toes up), reaching along it. */
function reachPlan(o) {
  const ch = { pos: [0, 0, 0], yaw: 0, arms: false }, g0 = seatGeom(ch);
  const hip = [0, SEAT_H + HIP_SEAT, -.05], hipR = [-B.hipHalf, hip[1], hip[2]];
  const L0 = B.thigh + B.shin, drop = hip[1] - B.ankleH, run = Math.sqrt(L0 * L0 - drop * drop);
  const legPitch = Math.atan2(drop, run);
  const ankR0 = [hipR[0], B.ankleH, hip[2] + run * .999];
  const footPitch = Math.PI / 2 - legPitch;
  const ankL = [B.hipHalf + .02, B.ankleH, hip[2] + .4];
  const toeOf = ank => add(ank, rot(add(sc([0, 0, 1], B.toe), sc(UP, -B.ankleH * .5)), [-1, 0, 0], footPitch));
  const trials = [{ t0: 2, reach: -.04 }, { t0: 10.5, reach: .02 }];
  const reachS = 2.5, holdS = 2, backS = 1.6;
  const state = tt => {
    for (const tr of trials) {
      const s = tt - tr.t0;
      if (s >= -1 && s < reachS + holdS + backS) {
        if (s < 0) return { w: 0, hands: smooth(s + 1), reach: tr.reach };
        if (s < reachS) return { w: smooth(s / reachS), hands: 1, reach: tr.reach };
        if (s < reachS + holdS) return { w: 1, hands: 1, reach: tr.reach, hold: s - reachS };
        return { w: 1 - smooth((s - reachS - holdS) / backS), hands: 1, reach: tr.reach };
      }
    }
    return { w: 0, hands: 0, reach: 0 };
  };
  return {
    go: 1, trials, reachS, holdS, toeOf, ankR0,
    pose(tt) {
      const st = state(tt);
      const bend = o.bend ? smooth(clamp((st.w - .6) / .4, 0, 1)) : 0;
      const ankR = add(ankR0, [0, 0, -.07 * bend]);

      const goal = add(add(toe, [0, .03, (st.reach || 0) + .02 * bend]), [-B.hipHalf * .55, 0, 0]);
      const rest = add(mix(hipR, knee0, .7), [.06, .1, 0]);

      return { p: hip, yaw: 0, lean: Math.min(lean, st.w > .02 ? lean : .1), ankles: { L: ankL, R: ankR }, feet: { R: { pitch: footPitch } }, arms, head: { pitch: -.15 * st.w } , st, toe };
    },
  };
}

/** Tremor: seated facing the phone, hands at rest on the thighs, then held out in front. */
function tremorPlan() {
  const ch = { pos: [0, 0, 0], yaw: 0, arms: false }, g = seatGeom(ch);
  return {
    go: 1,
    pose(tt) {
      const raise = smooth((tt - 7.2) / 1) * (1 - smooth((tt - 14.2) / 1));
      const jit = S => [.006 * Math.sin(TAU * 5.2 * tt + (S === 'L' ? 0 : 1.3)), .007 * Math.sin(TAU * 5.2 * tt + (S === 'L' ? .6 : 2)), 0];

      if (raise >= .999) for (const S of ['L', 'R']) arms[S] = Object.assign({}, out, { jitter: jit(S) });

/** Turn in place: 180° to the right, a pause, then back to the left. Each foot landing is a step; the last two
    landings square the feet up. `enBloc`: many small shuffling steps, head and trunk turning together. */
function turnPlan(o) {
  const go = 1, pause = 1.6;
  const a0 = go, a1 = go + o.dur1, b0 = a1 + pause, b1 = b0 + o.dur2;
  const g = [0, 0, 0], feet = new Footsteps(place(g, 0, 'L'), place(g, 0, 'R'), 0), turns = [], lands = [[], []];
  const turn = (t0, t1, h0, h1, n, first, li) => {
    const d = (t1 - t0) / n, sw = Math.min(.85 * d, .5);
    let side = first;
    for (let k = 1; k <= n; k++) {
      const land = t0 + k * d, ha = lerp(h0, h1, Math.min(1, (k - 1) / (n - 1))), hb = lerp(h0, h1, Math.min(1, k / (n - 1)));
      feet.add(side, land - sw, land, place(g, hb, side), hb);
      turns.push([land - sw, land, ha, hb]); lands[li].push(land);
      side = side === 'R' ? 'L' : 'R';
    }
  };

  turn(b0, b1, -Math.PI, 0, o.n2, 'L', 1);         // and back to the left

    go, a0, a1, b0, b1, n1: o.n1, n2: o.n2,
    steps: (tt, i) => lands[i].filter(x => x <= tt).length,
    pose(tt) {
      const fl = feet.foot('L', tt, lift), fr = feet.foot('R', tt, lift), h = heading(tt);
      const dh = heading(tt + .18) - h, moving = Math.abs(dh) > 1e-3;

      return { p, yaw: h, lean: o.enBloc ? .12 : .04, ankles: { L: fl.p, R: fr.p }, feet: { L: { yaw: fl.yaw, pitch: fl.pitch }, R: { yaw: fr.yaw, pitch: fr.pitch } },
               arms, head: { pitch: o.enBloc ? .12 : .06, yaw: headLead } };
    },
  };
}

/** Back scratch (Senior Fitness Test): standing, the right hand reaches down the middle of the back from over the
    shoulder, the left hand up from the waist; the score is the distance between the middle fingertips (gap minus). */
function scratchPlan(o) {
  const trials = [{ t0: 1.4, gap: -.08 }, { t0: 8.4, gap: -.06 }];
  const reachS = 2.2, holdS = 2.4, backS = 1.6, finger = .075;
  const state = tt => {
    for (let i = 0; i < trials.length; i++) {
      const tr = trials[i], s = tt - tr.t0;
      if (s >= 0 && s < reachS + holdS + backS) {
        const w = s < reachS ? smooth(s / reachS) : s < reachS + holdS ? 1 : 1 - smooth((s - reachS - holdS) / backS);
        return { w, gap: tr.gap, trial: i, hold: s >= reachS && s < reachS + holdS ? s - reachS : undefined };
      }

    trials, reachS, holdS, finger, state,
    pose(tt) {

    },
  };
}

/* ============================================================== helper */
function helperBody(task, tt) {
  if (!task.helper) return null;
  const h = task.helper(tt);
  const main = task.pose(tt).p;
  const toward = h.facePerson ? Math.atan2(main[0] - h.at[0], main[2] - h.at[2]) : null;
  const ahead = task.helper(tt + .25).at, dz = sub(ahead, h.at), moving = len(dz) > .03;
  const yaw = moving ? Math.atan2(dz[0], dz[2]) : (toward ?? 0);
  const f = facing(yaw), r = rightOf(f);
  const g = [h.at[0], 0, h.at[2]];
  const ph = (h.at[2] + h.at[0]) / .55 * Math.PI;
  const s = moving ? Math.sin(ph) : 0, lift = moving ? .05 : 0;
  const ankles = { L: add(add(add(g, sc(r, -.1)), sc(f, .2 * s)), [0, B.ankleH + lift * Math.max(0, -Math.cos(ph)), 0]),
                   R: add(add(add(g, sc(r, .1)), sc(f, -.2 * s)), [0, B.ankleH + lift * Math.max(0, Math.cos(ph)), 0]) };
  const reach = h.reach || 0;
  const arms = moving ? { L: { flex: -.25 * s, abd: .08, elbow: .3 }, R: { flex: .25 * s, abd: .08, elbow: .3 } }
                      : { L: { flex: .35 + .7 * reach, abd: .15, elbow: .9 - .5 * reach }, R: { flex: .35 + .7 * reach, abd: .15, elbow: .9 - .5 * reach } };
  return makeBody({ p: [g[0], STAND_Y - .01, g[2]], yaw, lean: .05, ankles, arms });
}

}

/** Side by side: the mistake stands to the screen's left of the right way, one metre across the view. */
function sideOffset() {

}

                  'shL', 'shR', 'elL', 'elR', 'wrL', 'wrR', 'handL', 'handR'];
function moved(J, o) { const K = Object.assign({}, J); for (const k of POS_KEYS) K[k] = add(J[k], o); return K; }
function movedPrims(P, o) {
  return P.map(q => q.k === 'poly' ? Object.assign({}, q, { pts: q.pts.map(v => add(v, o)), at: add(q.at, o) })

function bodiesAt(tt) {
  const tk = task(), out = [];

  const extra = tk.extraOf ? tk.extraOf(spec) : null;

    const bx = tk.extraOf ? tk.extraOf(bs) : null, ref = !!tk.cmpKeys;   // a reference to compare with, not a mistake
    out.push({ J, alpha: badA, pal: ref ? GHOST : GOLD, behind: !side, ghost: !side, extra: bx, label: side ? (ref ? L(tk.cmpKeys[0]) : 'k_bad') : null });

/** Is the whole body (and the test's lines or chair) in the phone's picture for the whole test? */

function computeFraming() {

  const out = { head: false, feet: false, hands: false }, m = rr.w * .01;

view.addEventListener('pointercancel', lift);
view.addEventListener('wheel', e => { e.preventDefault(); goal.dist = clamp(goal.dist * (1 + e.deltaY * .001), 1.5, 14); }, { passive: false });
view.addEventListener('keydown', e => {
  const d = { ArrowLeft: [.15, 0], ArrowRight: [-.15, 0], ArrowUp: [0, .1], ArrowDown: [0, -.1] }[e.key];
  if (!d) return;
  e.preventDefault(); stopFollowing();
  cam.az += d[0]; cam.el = clamp(cam.el + d[1], .02, 1.45);
});

function resize() {
  const r = view.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.max(2, Math.round(r.width * dpr)), H = Math.max(2, Math.round(r.height * dpr));
  if (view.width !== W || view.height !== H) { view.width = W; view.height = H; framing = null; }
}

function showCue(text) {
  const el = $('#cue'); el.textContent = text; el.classList.add('on');
  clearTimeout(cueTimer); cueTimer = setTimeout(() => el.classList.remove('on'), 900);
}

/* ================================================================ loop */
let last = performance.now();
function draw() {
  const tk = task(), W = view.width, H = view.height;
  const scene = { task: tk, bodies: bodiesAt(state.t), phone: state.tab === 'setup', phoneView: state.tab === 'setup' && state.phoneView,
                  roomOffset: sideBySide() ? sideOffset() : null };
  if (state.tab === 'setup' && !scene.phoneView) { scene.dims = tk.dims; scene.labels = (tk.labels || []).map(l => ({ p: l.p, text: L(l.text), tone: l.tone })); }
  if (tk.bubble && !scene.phoneView) {                    // what is said aloud, or what the helper reads off
    const mb = scene.bodies.find(b => b.main), bb = mb && tk.bubble(state.t, mb.J);
    if (bb) scene.labels = (scene.labels || []).concat([{ p: bb.p, text: bb.text, tone: 'ink' }]);
  }
  if (scene.phoneView) {
    const pc = phoneCam(tk.phone, W, H);
    render(vctx, W, H, pc, scene);
    const r = pc.rect, rad = Math.min(r.w, r.h) * .06;
    vctx.save(); vctx.fillStyle = colors.stage; vctx.globalAlpha = .86;
    vctx.beginPath(); vctx.rect(0, 0, W, H); vctx.roundRect ? vctx.roundRect(r.x, r.y, r.w, r.h, rad) : vctx.rect(r.x, r.y, r.w, r.h); vctx.fill('evenodd');
    vctx.globalAlpha = 1; vctx.strokeStyle = colors.ink; vctx.lineWidth = Math.max(2, W / 200);
    vctx.beginPath(); vctx.roundRect ? vctx.roundRect(r.x, r.y, r.w, r.h, rad) : vctx.rect(r.x, r.y, r.w, r.h); vctx.stroke(); vctx.restore();
  } else {
    render(vctx, W, H, orbitCam(cam, W, H), scene);
  }
  // chips, cue, framing
  $('#chipMain').textContent = tk.chip(state.t);
  const note = tk.note ? tk.note(state.t) : '';
  $('#chipNote').hidden = !note; $('#chipNote').textContent = note;
  let si = 0; tk.steps.forEach((st, i) => { if (state.t >= st.t) si = i; });
  if (si !== lastStep) {
    $$('#steps li').forEach((li, i) => { if (i === si) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current'); });
    if (lastStep !== -1 && tk.steps[si].cue) showCue(t(tk.steps[si].cue));
    lastStep = si;
  }
  const fc = $('#frameCheck');
  $('#frameCheck').title = tk.frameWindow ? P('只看计时的那一段', 'Judged over the timed part', 'Se juzga solo la parte cronometrada') : '';
  fc.hidden = !scene.phoneView;
  $('#hint').hidden = scene.phoneView;
  if (scene.phoneView) {
    if (!framing) framing = computeFraming();
    const parts = Object.entries(framing.out).filter(([, v]) => v).map(([k]) => t('part_' + k));
    const lines = [parts.length ? t('frame_bad', { parts: parts.join(t('sep')) }) : t('frame_ok')];
    if (framing.scene !== null) lines.push(framing.scene ? t('frame_scene_ok', { what: L(tk.sceneWhat) }) : t('frame_scene_bad', { what: L(tk.sceneWhat) }));
    $('#frameText').textContent = lines.join(' · ');
    $('#frameText').className = parts.length || framing.scene === false ? 'warn' : 'ok';
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  const raw = Math.min(.05, (now - last) / 1000);
  last = now;
  if (document.hidden) return;
  const tk = task();
  if (state.playing) {
    const before = state.t;
    state.t += raw * (state.slow ? .35 : 1);
    if (tk.cueStop && before < tk.cueStop && state.t >= tk.cueStop) showCue(t('stop'));
    if (state.t >= tk.dur) { state.t -= tk.dur; lastStep = -1; }
  }
  const ease = 1 - Math.pow(.002, raw);
  if (goal.az !== null) { cam.az += (goal.az - cam.az) * ease; cam.el += (goal.el - cam.el) * ease; }
  cam.dist += (goal.dist - cam.dist) * ease;
  cam.target = cam.target.map((v, i) => v + (goal.target[i] - v) * ease);
  draw();
}

readColors();
{ const i = TASKS.findIndex(x => x.id === CFG.test); if (i >= 0) { state.task = i; state.cmp = TASKS[i].cmp || 'side'; } }
applyLang();
if (['move', 'setup', 'points'].includes(CFG.tab)) setTab(CFG.tab);
aim();
Object.assign(cam, { az: goal.az + .35, el: goal.el, dist: goal.dist, target: goal.target.slice() });
resize();
new ResizeObserver(() => resize()).observe($('#app'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
requestAnimationFrame(frame);

// for automated checks
window.__mw = { state, cam, goal, TASKS, setTab, selectTask, draw, makeBody, computeFraming: () => computeFraming(),
                configure: c => { configure(c); readColors(); applyLang(); framing = null; } };
}
</script>
</body>
</html>
